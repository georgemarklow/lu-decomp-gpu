[package]
name = "lu-decomp-gpu"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
csv = "1.4.0"
cubecl = { version = "0.6", features = ["wgpu"] }
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.9"
lapack = "0.19"
lapack-src = { version = "0.10", features = ["openblas"] }
openblas-src = { version = "0.10", features = ["system"] }
